[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blobhell-aibench"
version = "0.1.0"
description = "Hardware-in-the-loop AI benchmark for autonomous legacy-system debugging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
blobhell = "blobhell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

